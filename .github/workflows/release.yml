name: Release

# Runs when a version tag such as v0.2.0 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./public/manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match public/manifest.json version $manifest" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack extension
        run: |
          (cd dist && zip -r "../smart-url-copy-${GITHUB_REF_NAME}.zip" .)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "smart-url-copy-${GITHUB_REF_NAME}.zip" \
            --title "Smart URL Copy ${GITHUB_REF_NAME}" \
            --generate-notes
